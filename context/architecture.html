<script>
/* ============================================================
   Topology graph engine — subsystem dependency graph
   Layered / Force / Radial · collapse-groups · blast-radius
   · tick-flow animation · drag persistence · ego mini-graphs
   ============================================================ */
window.Graph = (function () {
  const SVGNS = "http://www.w3.org/2000/svg";
  const LAYER_GAP = 224, ROW_GAP = 104;
  const POS_KEY = "nd.graph.pos.v3";

  let stage, svg, root, gEdges, gFlow, gNodes;
  let allNodes = [], allEdges = [], allById = {};
  let nodes = [], edges = [], byId = {};
  let collapsed = new Set();
  let posOverride = {};
  let view = { x: 0, y: 0, k: 1 };
  let selected = null, hovered = null, selEdge = null;
  let opts = {};
  let mode = "layered";
  let impactMode = false;
  let raf = null, flowTimer = null;

  function el(tag, a) { const e = document.createElementNS(SVGNS, tag); if (a) for (const k in a) e.setAttribute(k, a[k]); return e; }
  function relName(rel) { return { dep: "dependency", strong: "load-bearing", write: "write-back", peer: "hidden coupling" }[rel] || rel; }

  /* ---------- visible set (collapse groups) ---------- */
  function computeVisible() {
    const hidden = new Set();
    allNodes.forEach(n => { if (n.group && collapsed.has(n.group)) hidden.add(n.id); });
    nodes = allNodes.filter(n => !hidden.has(n.id));
    byId = {}; nodes.forEach(n => byId[n.id] = n);
    const map = id => (hidden.has(id) ? allById[id].group : id);
    const seen = new Set(); edges = [];
    allEdges.forEach(e => {
      const a = map(e.from), b = map(e.to);
      if (a === b) return;
      const key = a + ">" + b;
      if (seen.has(key)) { // keep strongest rel on merge
        const ex = edges.find(x => x.from === a && x.to === b);
        if (ex && rank(e.rel) > rank(ex.rel)) { ex.rel = e.rel; ex.label = e.label; }
        return;
      }
      seen.add(key);
      edges.push({ from: a, to: b, rel: e.rel, label: e.label });
    });
  }
  function rank(rel) { return { peer: 0, write: 1, dep: 2, strong: 3 }[rel] || 0; }
  function groupChildren(pid) { return allNodes.filter(n => n.group === pid).map(n => n.id); }

  /* ---------- layout ---------- */
  function computeLayers() {
    const fwd = edges.filter(e => e.rel === "dep" || e.rel === "strong");
    const layer = {};
    nodes.forEach(n => layer[n.id] = (n.lock != null ? n.lock : 0));
    for (let i = 0; i < nodes.length; i++)
      fwd.forEach(e => { if (layer[e.from] + 1 > layer[e.to]) layer[e.to] = layer[e.from] + 1; });
    nodes.forEach(n => { if (n.lock != null && layer[n.id] < n.lock) layer[n.id] = n.lock; });
    return layer;
  }
  function groupByLayer(layer) {
    const g = {}; nodes.forEach(n => { (g[layer[n.id]] = g[layer[n.id]] || []).push(n); });
    return g;
  }
  function barycenter(layer, groups) {
    const keys = Object.keys(groups).map(Number).sort((a, b) => a - b);
    keys.forEach(L => groups[L].forEach((n, i) => n._ord = i));
    const ord = id => byId[id] ? byId[id]._ord : 0;
    for (let p = 0; p < 5; p++) keys.forEach(L => {
      groups[L].forEach(n => {
        const nb = edges.filter(e => e.from === n.id || e.to === n.id)
          .map(e => e.from === n.id ? e.to : e.from).filter(id => byId[id] && Math.abs(layer[id] - L) === 1);
        n._bc = nb.length ? nb.reduce((s, id) => s + ord(id), 0) / nb.length : n._ord;
      });
      groups[L].sort((a, b) => a._bc - b._bc).forEach((n, i) => n._ord = i);
    });
  }
  function layeredLayout() {
    const layer = computeLayers(), groups = groupByLayer(layer);
    barycenter(layer, groups);
    Object.keys(groups).map(Number).forEach(L => {
      const g = groups[L], total = (g.length - 1) * ROW_GAP;
      g.forEach((n, i) => { n.x = L * LAYER_GAP; n.y = i * ROW_GAP - total / 2; });
    });
    applyOverrides();
  }
  function radialLayout() {
    const layer = computeLayers(), groups = groupByLayer(layer);
    barycenter(layer, groups);
    Object.keys(groups).map(Number).forEach(L => {
      const g = groups[L];
      if (L === 0 && g.length === 1) { g[0].x = 0; g[0].y = 0; return; }
      const radius = 130 + L * 132;
      g.forEach((n, i) => {
        const ang = (i / g.length) * Math.PI * 2 - Math.PI / 2 + L * 0.55;
        n.x = Math.cos(ang) * radius; n.y = Math.sin(ang) * radius;
      });
    });
    applyOverrides();
  }
  function applyOverrides() {
    nodes.forEach(n => { const o = posOverride[n.id]; if (o) { n.x = o.x; n.y = o.y; } });
  }
  function forceLayout() {
    nodes.forEach(n => { n.vx = 0; n.vy = 0; });
    const links = edges.map(e => ({ s: byId[e.from], t: byId[e.to] })).filter(l => l.s && l.t);
    let it = 0; const total = 300;
    cancelAnimationFrame(raf);
    (function tick() {
      for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        let dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy || 1, d = Math.sqrt(d2), f = 26000 / d2;
        a.vx += dx / d * f; a.vy += dy / d * f; b.vx -= dx / d * f; b.vy -= dy / d * f;
      }
      links.forEach(l => {
        let dx = l.t.x - l.s.x, dy = l.t.y - l.s.y, d = Math.sqrt(dx * dx + dy * dy) || 1, f = (d - 185) * 0.04;
        l.s.vx += dx / d * f; l.s.vy += dy / d * f; l.t.vx -= dx / d * f; l.t.vy -= dy / d * f;
      });
      nodes.forEach(n => { n.vx += -n.x * 0.008; n.vy += -n.y * 0.008; });
      nodes.forEach(n => { if (n._dragging) return; n.vx *= 0.82; n.vy *= 0.82; n.x += Math.max(-30, Math.min(30, n.vx)); n.y += Math.max(-30, Math.min(30, n.vy)); });
      renderPositions();
      if (++it < total) raf = requestAnimationFrame(tick); else fit(true);
    })();
  }

  /* ---------- build DOM ---------- */
  function buildEdges() {
    edges.forEach(e => {
      const p = el("path", { class: "edge rel-" + e.rel, "marker-end": "url(#ar-" + e.rel + ")" });
      e._p = p; gEdges.append(p);
      const f = el("path", { class: "edge-flow rel-" + e.rel }); e._f = f; gFlow.append(f);
      const hit = el("path", { class: "edge-hit", fill: "none", stroke: "transparent", "stroke-width": 16 });
      e._hit = hit; gFlow.append(hit);
      hit.addEventListener("mouseenter", ev => {
        if (!selEdge) e._p.classList.add("hot");
        if (window.__tip) window.__tip.show(ev.clientX, ev.clientY,
          `<b>${e.from} → ${e.to}</b><span class="tip-rel rel-${e.rel}">${relName(e.rel)}</span>${e.label}`);
      });
      hit.addEventListener("mousemove", ev => window.__tip && window.__tip.move(ev.clientX, ev.clientY));
      hit.addEventListener("mouseleave", () => { window.__tip && window.__tip.hide(); if (!selEdge) paint(); });
      hit.addEventListener("mousedown", ev => ev.stopPropagation());
      hit.addEventListener("click", ev => { ev.stopPropagation(); selectEdge(e); });
    });
  }
  function buildNodes() {
    nodes.forEach((n, i) => {
      const w = n.w, h = n.h;
      const g = el("g", { class: "node", style: `--kc: var(--k-${n.kind})` });
      g.dataset.id = n.id;
      g.style.animationDelay = (i * 34) + "ms";
      g.classList.add("node-enter");
      g.addEventListener("animationend", function onEnd(ev) {
        if (ev.animationName === "nodeEnter") { g.classList.remove("node-enter"); g.removeEventListener("animationend", onEnd); }
      });
      const pulse = el("rect", { class: "node-pulse", x: -w / 2, y: -h / 2, width: w, height: h, rx: 11, fill: "none", stroke: `var(--k-${n.kind})`, "stroke-width": 1.5, style: "transform-box: fill-box; transform-origin: center;" });
      const glow = el("rect", { class: "node-glow", x: -w / 2, y: -h / 2, width: w, height: h, rx: 11, fill: "none", stroke: `var(--k-${n.kind})`, "stroke-width": 2 });
      const box = el("rect", { class: "node-box", x: -w / 2, y: -h / 2, width: w, height: h, rx: 11, fill: "#11131b", stroke: `var(--k-${n.kind})`, "stroke-width": 1.4 });
      const dot = el("circle", { class: "node-dot", cx: -w / 2 + 16, cy: 0, r: 3.5 + Math.min(n._deg, 8) * 0.42, fill: `var(--k-${n.kind})` });
      const label = el("text", { class: "node-label", x: -w / 2 + 28, y: -1, "text-anchor": "start", "font-size": 13, fill: "#e7eaf2", "dominant-baseline": "middle" });
      label.textContent = n.label;
      const sub = el("text", { class: "node-sub", x: -w / 2 + 28, y: 12, "text-anchor": "start", "font-size": 8.5, fill: "#6b7488", "dominant-baseline": "middle", "letter-spacing": ".04em" });
      sub.textContent = n.root.replace("src/", "").replace(/\/$/, "").replace(".rs", "") || "entry";
      g.append(pulse, glow, box, dot, label, sub);

      // collapse/expand control for group parents
      if (n.collapsible) {
        const kids = groupChildren(n.id).length;
        const isC = collapsed.has(n.id);
        const ctrl = el("g", { class: "node-ctrl" });
        const cx = w / 2 - 13;
        ctrl.append(el("circle", { cx, cy: -h / 2 + 13, r: 8, fill: "#0b0d12", stroke: `var(--k-${n.kind})`, "stroke-width": 1.2 }));
        const ct = el("text", { x: cx, y: -h / 2 + 13, "text-anchor": "middle", "dominant-baseline": "central", "font-size": 9, fill: `var(--k-${n.kind})`, "font-family": "var(--mono)" });
        ct.textContent = isC ? "+" + kids : "–";
        ctrl.append(ct);
        ctrl.addEventListener("mousedown", ev => ev.stopPropagation());
        ctrl.addEventListener("click", ev => { ev.stopPropagation(); toggleGroup(n.id); });
        g.append(ctrl);
      }

      n._g = g; gNodes.append(g);
      g.addEventListener("mouseenter", () => setHover(n.id));
      g.addEventListener("mouseleave", () => setHover(null));
      g.addEventListener("mousedown", ev => startNodeDrag(ev, n));
    });
  }

  function edgePath(e) {
    const s = byId[e.from], t = byId[e.to]; if (!s || !t) return "";
    if (t.x >= s.x) {
      const sx = s.x + s.w / 2, tx = t.x - t.w / 2, mx = (sx + tx) / 2;
      return `M ${sx} ${s.y} C ${mx} ${s.y}, ${mx} ${t.y}, ${tx} ${t.y}`;
    }
    const sx = s.x - s.w / 2, tx = t.x + t.w / 2, bow = 60 + Math.abs(s.y - t.y) * 0.2;
    return `M ${sx} ${s.y} C ${sx - 70} ${s.y + bow}, ${tx + 70} ${t.y + bow}, ${tx} ${t.y}`;
  }
  function renderPositions() {
    nodes.forEach(n => n._g.setAttribute("transform", `translate(${n.x},${n.y})`));
    edges.forEach(e => { const d = edgePath(e); e._p.setAttribute("d", d); e._f.setAttribute("d", d); e._hit.setAttribute("d", d); });
    updateMinimapGeom();
  }
  function applyView() {
    root.setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`);
    const zl = document.getElementById("zoomVal"); if (zl) zl.textContent = Math.round(view.k * 100) + "%";
    drawMinimap();
  }

  /* ---------- highlight / paint ---------- */
  function neighborSet(id) { const s = new Set([id]); edges.forEach(e => { if (e.from === id) s.add(e.to); if (e.to === id) s.add(e.from); }); return s; }
  function downstream(id) {
    // transitive consumers via forward edges (dep/strong/write)
    const dist = { [id]: 0 }; let frontier = [id];
    while (frontier.length) {
      const nxt = [];
      frontier.forEach(u => edges.forEach(e => {
        if (e.from === u && e.rel !== "peer" && dist[e.to] == null) { dist[e.to] = dist[u] + 1; nxt.push(e.to); }
      }));
      frontier = nxt;
    }
    return dist;
  }

  function clearPaint() {
    nodes.forEach(n => { n._g.classList.remove("dim", "selected"); n._g.style.removeProperty("--impact"); });
    edges.forEach(e => { e._p.classList.remove("dim", "hot", "sel"); e._f.classList.remove("run"); });
  }
  function paint() {
    if (selEdge) return paintEdge();
    const focus = hovered || selected;
    if (!focus) { clearPaint(); return; }
    if (impactMode && selected && focus === selected) return paintImpact(selected);
    const nb = neighborSet(focus);
    nodes.forEach(n => { n._g.classList.toggle("dim", !nb.has(n.id)); n._g.classList.toggle("selected", n.id === selected); n._g.style.removeProperty("--impact"); });
    edges.forEach(e => {
      const hot = e.from === focus || e.to === focus;
      e._p.classList.toggle("hot", hot); e._p.classList.toggle("dim", !hot); e._p.classList.remove("sel");
      e._f.classList.toggle("run", hot);
    });
  }
  function paintImpact(id) {
    const dist = downstream(id);
    const maxD = Math.max(1, ...Object.values(dist));
    nodes.forEach(n => {
      const d = dist[n.id];
      n._g.classList.toggle("dim", d == null);
      n._g.classList.toggle("selected", n.id === id);
      if (d != null && d > 0) n._g.style.setProperty("--impact", (1 - (d - 1) / (maxD)) * 0.7 + 0.3);
      else n._g.style.removeProperty("--impact");
    });
    edges.forEach(e => {
      const inPath = dist[e.from] != null && dist[e.to] != null && dist[e.to] === dist[e.from] + 1 && e.rel !== "peer";
      e._p.classList.toggle("hot", inPath); e._p.classList.toggle("dim", !inPath); e._p.classList.remove("sel");
      e._f.classList.toggle("run", inPath);
    });
    if (opts.onImpact) opts.onImpact({ id, reached: Object.keys(dist).length - 1, nodes: Object.keys(dist).filter(k => k !== id) });
  }
  function paintEdge() {
    const e0 = selEdge;
    nodes.forEach(n => { const on = n.id === e0.from || n.id === e0.to; n._g.classList.toggle("dim", !on); n._g.classList.remove("selected"); });
    edges.forEach(e => {
      const sel = e === e0;
      e._p.classList.toggle("sel", sel); e._p.classList.toggle("hot", sel); e._p.classList.toggle("dim", !sel);
      e._f.classList.toggle("run", sel);
    });
  }

  function setHover(id) { if (selEdge) return; hovered = id; paint(); }

  /* ---------- selection ---------- */
  function syncExplorer() {
    document.querySelectorAll(".lr-item.node-item").forEach(it => it.classList.toggle("active", it.dataset.node === selected));
  }
  function clearEdge() { if (selEdge) { selEdge = null; if (opts.onEdgeSelect) opts.onEdgeSelect(null); } }
  function select(id) {
    clearEdge();
    selected = (selected === id) ? null : id;
    paint();
    if (opts.onSelect) opts.onSelect(selected);
    if (selected) centerOn(byId[selected]);
    syncExplorer();
  }
  function selectExternal(id) {
    clearEdge();
    // expand a collapsed group if the target is hidden inside it
    const tgt = allById[id];
    if (tgt && tgt.group && collapsed.has(tgt.group)) { collapsed.delete(tgt.group); rebuild(); }
    selected = id; hovered = null; paint();
    if (opts.onSelect) opts.onSelect(selected);
    if (id && byId[id]) centerOn(byId[id]);
    syncExplorer();
  }
  function selectEdge(e) {
    if (selEdge === e) { deselect(); return; } // toggle off on re-click
    selected = null; hovered = null; selEdge = e;
    if (opts.onSelect) opts.onSelect(null);
    syncExplorer();
    paintEdge();
    if (opts.onEdgeSelect) opts.onEdgeSelect(e);
  }
  function deselect() {
    if (!selected && !selEdge) return;
    selected = null; selEdge = null; clearPaint();
    if (opts.onSelect) opts.onSelect(null);
    if (opts.onEdgeSelect) opts.onEdgeSelect(null);
    syncExplorer();
  }

  /* ---------- collapse / expand ---------- */
  function toggleGroup(pid) {
    let selChanged = false;
    if (collapsed.has(pid)) collapsed.delete(pid); else {
      collapsed.add(pid);
      if (selected && allById[selected] && allById[selected].group === pid) { selected = pid; selChanged = true; }
    }
    rebuild();
    if (selChanged && opts.onSelect) opts.onSelect(selected);
  }

  /* ---------- drag / pan / zoom ---------- */
  function clientToWorld(cx, cy) { const r = stage.getBoundingClientRect(); return { x: (cx - r.left - view.x) / view.k, y: (cy - r.top - view.y) / view.k }; }
  function startNodeDrag(ev, n) {
    ev.stopPropagation();
    const start = clientToWorld(ev.clientX, ev.clientY);
    const ox = n.x - start.x, oy = n.y - start.y; n._dragging = true; let moved = false;
    function move(e) { const w = clientToWorld(e.clientX, e.clientY); n.x = w.x + ox; n.y = w.y + oy; moved = true; renderPositions(); }
    function up() {
      n._dragging = false;
      window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up);
      if (!moved) select(n.id);
      else { posOverride[n.id] = { x: n.x, y: n.y }; savePositions(); }
    }
    window.addEventListener("mousemove", move); window.addEventListener("mouseup", up);
  }
  function savePositions() { try { localStorage.setItem(POS_KEY, JSON.stringify(posOverride)); } catch (e) {} }
  function loadPositions() { try { posOverride = JSON.parse(localStorage.getItem(POS_KEY)) || {}; } catch (e) { posOverride = {}; } }
  function resetPositions() { posOverride = {}; savePositions(); setMode(mode); }

  function initPanZoom() {
    let panning = false, sx, sy, vx, vy;
    stage.addEventListener("mousedown", e => {
      if (e.target.closest(".node") || e.target.closest(".edge-hit")) return;
      panning = true; stage.classList.add("panning"); sx = e.clientX; sy = e.clientY; vx = view.x; vy = view.y;
      deselect();
    });
    window.addEventListener("mousemove", e => { if (!panning) return; view.x = vx + (e.clientX - sx); view.y = vy + (e.clientY - sy); applyView(); });
    window.addEventListener("mouseup", () => { panning = false; stage.classList.remove("panning"); });
    stage.addEventListener("wheel", e => {
      e.preventDefault();
      const r = stage.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
      const nk = Math.max(0.3, Math.min(2.6, view.k * (1 - e.deltaY * 0.0015)));
      const wx = (mx - view.x) / view.k, wy = (my - view.y) / view.k;
      view.k = nk; view.x = mx - wx * nk; view.y = my - wy * nk; applyView();
    }, { passive: false });
  }

  function bbox() {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    nodes.forEach(n => { x0 = Math.min(x0, n.x - n.w / 2); y0 = Math.min(y0, n.y - n.h / 2); x1 = Math.max(x1, n.x + n.w / 2); y1 = Math.max(y1, n.y + n.h / 2); });
    return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
  }
  function fit(animate) {
    const r = stage.getBoundingClientRect(); if (r.width < 2 || r.height < 2) return;
    const b = bbox(), pad = Math.max(28, Math.min(72, r.width * 0.07));
    const k = Math.min((r.width - pad * 2) / b.w, (r.height - pad * 2) / b.h, 1.35);
    const tx = (r.width - b.w * k) / 2 - b.x0 * k, ty = (r.height - b.h * k) / 2 - b.y0 * k;
    if (animate) animateView(tx, ty, k); else { view = { x: tx, y: ty, k }; applyView(); }
  }
  function centerOn(n) { const r = stage.getBoundingClientRect(); animateView(r.width * 0.42 - n.x * view.k, r.height / 2 - n.y * view.k, view.k); }
  function animateView(tx, ty, tk) {
    const s = { ...view }, t0 = performance.now(), dur = 460; cancelAnimationFrame(raf);
    (function step(now) {
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      view.x = s.x + (tx - s.x) * e; view.y = s.y + (ty - s.y) * e; view.k = s.k + (tk - s.k) * e; applyView();
      if (p < 1) raf = requestAnimationFrame(step);
    })(performance.now());
  }
  function zoomBy(f) {
    const r = stage.getBoundingClientRect(), mx = r.width / 2, my = r.height / 2;
    const nk = Math.max(0.3, Math.min(2.6, view.k * f)), wx = (mx - view.x) / view.k, wy = (my - view.y) / view.k;
    view.k = nk; view.x = mx - wx * nk; view.y = my - wy * nk; applyView();
  }

  /* ---------- minimap ---------- */
  let mm, mmView, mmReady = false;
  function buildMinimap() {
    mm = document.getElementById("minimapSvg"); if (!mm) return;
    mm.replaceChildren();
    edges.forEach(e => { const l = el("line", { stroke: "rgba(255,255,255,0.14)", "stroke-width": 2.5 }); e._mml = l; mm.append(l); });
    nodes.forEach(n => { const c = el("rect", { rx: 8, fill: `var(--k-${n.kind})`, opacity: .85 }); n._mm = c; mm.append(c); });
    mmView = el("rect", { class: "mm-view" }); mm.append(mmView);
    mmReady = true; updateMinimapGeom();
  }
  function updateMinimapGeom() {
    if (!mmReady) return;
    const b = bbox(), pad = 34;
    mm.setAttribute("viewBox", `${b.x0 - pad} ${b.y0 - pad} ${b.w + pad * 2} ${b.h + pad * 2}`);
    edges.forEach(e => { const s = byId[e.from], t = byId[e.to]; if (!s || !t || !e._mml) return; e._mml.setAttribute("x1", s.x); e._mml.setAttribute("y1", s.y); e._mml.setAttribute("x2", t.x); e._mml.setAttribute("y2", t.y); });
    nodes.forEach(n => { if (!n._mm) return; n._mm.setAttribute("x", n.x - n.w / 2); n._mm.setAttribute("y", n.y - n.h / 2); n._mm.setAttribute("width", n.w); n._mm.setAttribute("height", n.h); });
  }
  function drawMinimap() {
    if (!mmReady) return;
    const r = stage.getBoundingClientRect();
    mmView.setAttribute("x", -view.x / view.k); mmView.setAttribute("y", -view.y / view.k);
    mmView.setAttribute("width", r.width / view.k); mmView.setAttribute("height", r.height / view.k);
  }

  /* ---------- tick-flow animation ---------- */
  function flowNodes(ids, o) {
    o = o || {}; stopFlow();
    const seq = ids.filter(id => byId[id]);
    if (!seq.length) return;
    let i = 0;
    function step() {
      nodes.forEach(n => n._g.classList.remove("flow-on"));
      edges.forEach(e => e._f.classList.remove("run", "flow-edge"));
      const id = seq[i], n = byId[id];
      if (n) n._g.classList.add("flow-on");
      if (i > 0) { const e = edges.find(e => e.from === seq[i - 1] && e.to === id) || edges.find(e => e.from === id && e.to === seq[i - 1]); if (e) { e._f.classList.add("run", "flow-edge"); } }
      if (opts.onFlowStep) opts.onFlowStep(i, id);
      i++;
      if (i < seq.length) flowTimer = setTimeout(step, o.interval || 620);
      else if (o.loop) { i = 0; flowTimer = setTimeout(step, 950); }
      else flowTimer = setTimeout(() => { stopFlow(); if (opts.onFlowEnd) opts.onFlowEnd(); }, 900);
    }
    fit(true); step();
  }
  function stopFlow() {
    clearTimeout(flowTimer); flowTimer = null;
    nodes.forEach(n => n._g && n._g.classList.remove("flow-on"));
    edges.forEach(e => e._f && e._f.classList.remove("run", "flow-edge"));
    if (!hovered && !selected && !selEdge) clearPaint();
  }
  function isFlowing() { return !!flowTimer; }

  /* ---------- external highlight (entity linking) ---------- */
  function highlight(ids) {
    const set = new Set(ids);
    nodes.forEach(n => n._g.classList.toggle("ext-hot", set.has(n.id)));
    nodes.forEach(n => n._g.classList.toggle("dim", set.size > 0 && !set.has(n.id)));
  }
  function clearHighlight() {
    nodes.forEach(n => n._g.classList.remove("ext-hot"));
    paint();
  }

  /* ---------- ego mini-graph (dossier) ---------- */
  function renderEgo(svgEl, id) {
    const center = allById[id]; if (!center) return;
    const outs = allEdges.filter(e => e.from === id).map(e => ({ id: e.to, dir: "out", rel: e.rel }));
    const ins = allEdges.filter(e => e.to === id).map(e => ({ id: e.from, dir: "in", rel: e.rel }));
    const all = [...ins, ...outs];
    const W = 300, H = 150, cx = W / 2, cy = H / 2;
    svgEl.setAttribute("viewBox", `0 0 ${W} ${H}`);
    let s = "";
    const place = [];
    const n = all.length || 1;
    all.forEach((nb, i) => {
      const ang = (i / n) * Math.PI * 2 - Math.PI / 2;
      const r = 56;
      place.push({ ...nb, x: cx + Math.cos(ang) * r * 1.7, y: cy + Math.sin(ang) * r });
    });
    place.forEach(p => {
      const col = { dep: "rgba(255,255,255,0.25)", strong: "#4fd6c0", write: "#9d8df7", peer: "#f0b65e" }[p.rel];
      const x1 = p.dir === "out" ? cx : p.x, y1 = p.dir === "out" ? cy : p.y;
      const x2 = p.dir === "out" ? p.x : cx, y2 = p.dir === "out" ? p.y : cy;
      s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="1.3" ${p.rel === "write" || p.rel === "peer" ? 'stroke-dasharray="3 3"' : ""}/>`;
    });
    place.forEach(p => {
      const k = allById[p.id].kind;
      s += `<g class="ego-node" data-ego="${p.id}" style="cursor:pointer"><circle cx="${p.x}" cy="${p.y}" r="5" fill="var(--k-${k})"/>` +
        `<text x="${p.x}" y="${p.y + 15}" text-anchor="middle" font-size="8.5" fill="#a6adbf" font-family="var(--mono)">${p.id}</text></g>`;
    });
    s += `<g><rect x="${cx - 30}" y="${cy - 13}" width="60" height="26" rx="7" fill="#11131b" stroke="var(--k-${center.kind})" stroke-width="1.4"/>` +
      `<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#e7eaf2" font-family="var(--mono)">${center.label}</text></g>`;
    svgEl.innerHTML = s;
    svgEl.querySelectorAll(".ego-node").forEach(g => g.addEventListener("click", () => selectExternal(g.dataset.ego)));
  }

  /* ---------- rebuild ---------- */
  function rebuild(relayout) {
    computeVisible();
    gEdges.replaceChildren(); gFlow.replaceChildren(); gNodes.replaceChildren();
    buildEdges(); buildNodes(); buildMinimap();
    doLayout();
    renderPositions();
    if (relayout !== false) fit(true);
    paint(); syncExplorer();
  }
  function doLayout() { if (mode === "force") forceLayout(); else if (mode === "radial") radialLayout(); else layeredLayout(); }

  function setMode(m) {
    mode = m;
    document.querySelectorAll("[data-graph-mode]").forEach(b => b.classList.toggle("active", b.dataset.graphMode === m));
    if (m === "force") forceLayout();
    else { doLayout(); renderPositions(); fit(true); }
  }
  function setImpact(on) {
    impactMode = on;
    document.querySelectorAll("[data-impact-toggle]").forEach(b => b.classList.toggle("active", on));
    paint();
    if (!on && opts.onImpact) opts.onImpact(null);
    else if (on && selected && opts.onImpact) paintImpact(selected);
  }

  function init(stageEl, o) {
    stage = stageEl; opts = o || {};
    allNodes = ARCH.nodes.map(n => ({ ...n }));
    allEdges = ARCH.edges.map(e => ({ ...e }));
    allById = {}; allNodes.forEach(n => allById[n.id] = n);
    const deg = {}; allNodes.forEach(n => deg[n.id] = 0);
    allEdges.forEach(e => { deg[e.from]++; deg[e.to]++; });
    allNodes.forEach(n => { n._deg = deg[n.id]; const d = Math.min(deg[n.id], 8); n.w = Math.max(106 + d * 5, 36 + n.label.length * 8.4); n.h = 44 + d * 1.7; });
    loadPositions();

    svg = el("svg");
    const defs = el("defs");
    [["dep", "rgba(255,255,255,0.3)"], ["strong", "#4fd6c0"], ["write", "#9d8df7"], ["peer", "#f0b65e"]].forEach(([k, c]) => {
      const m = el("marker", { id: "ar-" + k, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 6, markerHeight: 6, orient: "auto-start-reverse" });
      m.append(el("path", { d: "M0 0 L10 5 L0 10 z", fill: c })); defs.append(m);
    });
    svg.append(defs);
    root = el("g", { id: "graphRoot" });
    gEdges = el("g"); gFlow = el("g"); gNodes = el("g"); root.append(gEdges, gFlow, gNodes);
    svg.append(root); stage.append(svg);

    computeVisible(); buildEdges(); buildNodes(); buildMinimap();
    layeredLayout(); renderPositions(); initPanZoom();
    requestAnimationFrame(() => fit(false));

    let rt = null, lastW = 0, lastH = 0;
    new ResizeObserver(() => {
      const r = stage.getBoundingClientRect();
      if (r.width < 2 || r.height < 2) return;
      if (Math.abs(r.width - lastW) < 2 && Math.abs(r.height - lastH) < 2) return;
      lastW = r.width; lastH = r.height; clearTimeout(rt); rt = setTimeout(() => fit(true), 90);
    }).observe(stage);

    return {
      setMode, fit: () => fit(true), zoomIn: () => zoomBy(1.2), zoomOut: () => zoomBy(1 / 1.2),
      select: selectExternal, deselect, arrange: () => { resetPositions(); }, getSelected: () => selected,
      toggleGroup, setImpact, isImpact: () => impactMode,
      flowNodes, stopFlow, isFlowing,
      highlight, clearHighlight, renderEgo, resetPositions,
      selectEdge: (f, t) => { const e = edges.find(x => x.from === f && x.to === t) || edges.find(x => x.from === t && x.to === f); if (e) selectEdge(e); },
      hasNode: (id) => !!byId[id],
    };
  }

  return { init };
})();

</script>
<script>
/* ============================================================
   features.js — cross-cutting systems
   global search/command palette · entity linking · markdown
   source · state persistence · keyboard nav
   ============================================================ */
(function () {
  const A = window.ARCH;
  window.App = window.App || {};
  const App = window.App;
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  const esc = s => window.App.esc(s);

  /* ================= GLOBAL SEARCH / COMMAND PALETTE ================= */
  function buildIndex() {
    const idx = [];
    A.nodes.forEach(n => idx.push({ kind: "subsystem", label: n.label, sub: n.tagline, icon: "◉", color: `var(--k-${n.kind})`, run: () => App.selectNode(n.id) }));
    const secs = [
      ["Scope / Purpose", "source", "scope"], ["Repository Overview", "source", "overview"], ["Milestones", "source", "milestones"], ["Repository Tree", "source", "tree"],
      ["Data Flow", "flow", "flow"], ["Failure Semantics", "flow", "failures"], ["Critical Paths", "paths", "paths"],
      ...((A.bespoke || []).map(b => [b.title, "paths", "bespoke-" + b.id])),
      ["Dependency Layers", "deps", "layers"], ["Inter-System Relations", "deps", "relations"], ["Adjacency Matrix", "deps", "matrix"],
      ["State Ownership", "deps", "state"], ["Coverage", "cov", "cov"], ["Concept Map", "concept", "concept"], ["Structural Notes", "concept", "notes"],
    ];
    secs.forEach(([l, t, a]) => idx.push({ kind: "section", label: l, sub: "section · " + t, icon: "▸", color: "var(--tx-3)", run: () => App.openAnchor(t, a) }));
    A.glossary.forEach(g => idx.push({ kind: "term", label: g.term, sub: g.def, icon: "✦", color: "var(--cyan)", run: () => App.openAnchor("concept", "concept") }));
    A.risks.forEach(r => idx.push({ kind: "risk", label: r.title, sub: "risk · " + r.node, icon: "▲", color: "var(--red)", run: () => App.selectNode(r.node) }));
    A.decisions.forEach(d => idx.push({ kind: "decision", label: d.title, sub: "decision", icon: "◆", color: "var(--cyan)", run: () => App.selectNode(d.node) }));
    A.dataFlow.steps.forEach(s => idx.push({ kind: "step", label: `${String(s.n).padStart(2, "0")} ${s.fn}`, sub: "data-flow step · " + s.sys, icon: "↯", color: "var(--tx-3)", run: () => { App.openAnchor("flow", "flow"); setTimeout(() => App.flashStep(s.n), 350); } }));
    // commands
    idx.push({ kind: "cmd", label: "Play data flow on graph", sub: "command", icon: "▶", color: "var(--cyan)", run: () => { App.switchTab("graph"); App.graph().flowNodes(A.dataFlow.steps.map(s => s.sys.split("::")[0]).filter((x, i, a) => x !== a[i - 1]), { interval: 560 }); } });
    idx.push({ kind: "cmd", label: "Toggle blast-radius mode", sub: "command", icon: "⊛", color: "var(--cyan)", run: () => { App.switchTab("graph"); App.graph().setImpact(!App.graph().isImpact()); } });
    idx.push({ kind: "cmd", label: "View raw markdown source", sub: "command", icon: "⟨⟩", color: "var(--cyan)", run: () => { if (App.setMd) App.setMd(true); } });
    return idx;
  }
  const INDEX = buildIndex();

  function initSearch() {
    const inp = $("#search"), box = $("#searchResults");
    let active = -1, results = [];
    function render(q) {
      q = q.trim().toLowerCase();
      if (!q) { results = INDEX.slice(0, 8); }
      else results = INDEX.map(it => ({ it, s: score(it, q) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 9).map(x => x.it);
      active = results.length ? 0 : -1;
      box.innerHTML = results.length ? results.map((r, i) => `
        <div class="sr-item ${i === active ? "active" : ""}" data-i="${i}">
          <span class="sr-icon" style="color:${r.color}">${r.icon}</span>
          <span class="sr-main"><span class="sr-label">${esc(r.label)}</span><span class="sr-sub">${esc(r.sub.slice(0, 70))}</span></span>
          <span class="sr-kind">${esc(r.kind)}</span>
        </div>`).join("") : `<div class="sr-empty">No matches for “${esc(q)}”</div>`;
      box.classList.add("open");
      box.querySelectorAll(".sr-item").forEach(el => {
        el.addEventListener("mousedown", e => { e.preventDefault(); choose(+el.dataset.i); });
        el.addEventListener("mouseenter", () => { active = +el.dataset.i; hl(); });
      });
    }
    function score(it, q) {
      const l = it.label.toLowerCase(), s = (it.sub || "").toLowerCase();
      if (l === q) return 100;
      if (l.startsWith(q)) return 60;
      if (l.includes(q)) return 40;
      if (s.includes(q)) return 15;
      return 0;
    }
    function hl() { box.querySelectorAll(".sr-item").forEach((el, i) => el.classList.toggle("active", i === active)); }
    function choose(i) { const r = results[i]; if (r) { r.run(); close(); inp.blur(); } }
    function close() { box.classList.remove("open"); box.innerHTML = ""; }
    inp.addEventListener("input", () => render(inp.value));
    inp.addEventListener("focus", () => render(inp.value));
    inp.addEventListener("blur", () => setTimeout(close, 120));
    inp.addEventListener("keydown", e => {
      if (e.key === "ArrowDown") { e.preventDefault(); active = Math.min(results.length - 1, active + 1); hl(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); active = Math.max(0, active - 1); hl(); }
      else if (e.key === "Enter") { e.preventDefault(); choose(active); }
      else if (e.key === "Escape") { close(); inp.blur(); }
    });
    document.addEventListener("keydown", e => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); inp.focus(); inp.select(); render(inp.value); }
      else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "b") { e.preventDefault(); $("#toggleLeft").click(); }
    });
  }

  /* ================= UNIVERSAL ENTITY LINKING ================= */
  function initEntity() {
    function lit(name, on) {
      $$(`.ent[data-entity="${cssEsc(name)}"]`).forEach(el => el.classList.toggle("entity-lit", on));
      const owner = App.ENTITY[name];
      const g = App.graph && App.graph();
      if (on && owner && g && g.hasNode(owner)) g.highlight([owner]);
      else if (!on && g) g.clearHighlight();
    }
    function cssEsc(s) { return String(s).replace(/"/g, '\\"'); }
    document.addEventListener("mouseover", e => { const t = e.target.closest(".ent[data-entity]"); if (t) lit(t.dataset.entity, true); });
    document.addEventListener("mouseout", e => { const t = e.target.closest(".ent[data-entity]"); if (t) lit(t.dataset.entity, false); });
  }

  /* ================= MARKDOWN SOURCE ================= */
  function mdTable(headers, rows) {
    return `| ${headers.join(" | ")} |\n| ${headers.map(() => "---").join(" | ")} |\n` +
      rows.map(r => `| ${r.map(c => String(c).replace(/\|/g, "\\|").replace(/\n/g, " ")).join(" | ")} |`).join("\n");
  }
  const MD = {
    graph() {
      let s = `## Subsystem Map\n\n`;
      A.nodes.forEach(n => { s += `### ${n.label}  \`${n.root}\`\n${n.tagline}\n\n- **Owns:** ${n.owns}\n`; const o = A.edges.filter(e => e.from === n.id).map(e => `${e.to} (${e.rel})`); const i = A.edges.filter(e => e.to === n.id).map(e => `${e.from} (${e.rel})`); if (o.length) s += `- **Depends on / writes:** ${o.join(", ")}\n`; if (i.length) s += `- **Consumed by:** ${i.join(", ")}\n`; s += `\n`; });
      return s;
    },
    flow() {
      let s = `## Core Execution / Data Flow\n\n${A.dataFlow.intro}\n\nSimSet order: ${A.dataFlow.simsets.join(" → ")}\n\n`;
      A.dataFlow.steps.forEach(st => { s += `${String(st.n).padStart(2, "0")}. **${st.sys}::${st.fn}** \`${st.set}\`${st.fail ? " ⚠" : ""}\n    - reads: ${st.reads}\n    - writes: ${st.writes}\n`; });
      s += `\n### Failure Semantics\n\n`; A.failures.forEach(f => s += `- **${f.link} · ${f.title}** — ${f.body}\n`);
      return s;
    },
    deps() {
      let s = `## Dependency Direction\n\n`;
      A.layers.forEach((l, i) => s += `${i + 1}. **${l.name}** — ${l.role}\n`);
      s += `\n> ${A.layersNote}\n\n## Inter-System Relationships\n\n` + mdTable(["A", "B", "Mechanism", "Data", "Breaks if violated"], A.relationships.map(r => [r.a, r.b, r.mech, r.data, r.breaks]));
      s += `\n\n## State Ownership\n\n`; A.stateOwnership.forEach(o => s += `- **${o.owner}** — ${o.items}\n`);
      return s;
    },
    cov() {
      let s = `## Coverage\n\n${A.coverage.note}\n\n`;
      s += mdTable(["Module", ...A.coverage.cols], A.coverage.rows.map(r => [r.label, ...A.coverage.cols.map(c => r.cells[c] || "·")]));
      return s;
    },
    paths() {
      let s = `## Critical Paths & Blast Radius\n\n`;
      A.criticalPaths.forEach(p => s += `### ${p.name} (${p.len})\n${p.steps.join(" → ")}\n\n${p.blast}\n\n`);
      (A.bespoke || []).forEach(b => { s += `### ${b.title}\n${b.subtitle || ""}\n\n`; (b.steps || []).forEach(st => s += `- **${st.id}${st.sys ? " " + st.sys : ""}** - ${st.body}\n`); s += `\n`; });
      return s;
    },
    concept() {
      let s = `## Concept Map — ${A.concept.root}\n\n`;
      A.concept.branches.forEach(b => { s += `### ${b.head}\n` + b.leaves.map(l => `- ${l}`).join("\n") + "\n" + b.trunks.map(t => `- ${t}`).join("\n") + "\n\n"; });
      s += `> ${A.concept.note}\n\n## Structural Notes\n\n`; A.notes.forEach(n => s += `- **[${n.tag}] ${n.title}** — ${n.body}\n`);
      return s;
    },
    source() {
      const p = A.project;
      let s = `# ${p.name}\n\n${p.tagline}\n\n> ${p.purpose}\n\n## Tech stack\n` + p.techStack.map(t => `- ${t.name} (${t.meta})`).join("\n");
      s += `\n\n## Roadmap\n` + A.milestones.map(m => `- **${m.id} ${m.title}** [${m.status}] — ${m.note}`).join("\n");
      s += `\n\n## Repository\n` + treeMd(A.repoTree, 0);
      return s;
    },
  };
  function treeMd(n, d) { let s = `${"  ".repeat(d)}- ${n.name}${n.anno ? ` — ${n.anno}` : ""}\n`; (n.children || []).forEach(c => s += treeMd(c, d + 1)); return s; }
  App.markdownFor = tab => `<!-- generated from arch/data.js (view: ${tab}) -->\n\n` + ((MD[tab] && MD[tab]()) || "");

  /* ================= PERSISTENCE ================= */
  const KEY = "nd.state.v3";
  let restoring = false;
  function persist() {
    if (restoring) return;
    const wb = $("#workbench");
    const app = document.querySelector(".app");
    const st = {
      tab: App.curTab(), node: App.graph() ? App.graph().getSelected() : null,
      left: wb.classList.contains("left-collapsed"), right: wb.classList.contains("right-collapsed"),
      bottom: app.classList.contains("bottom-collapsed"),
    };
    try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {}
    const h = "#" + st.tab + (st.node ? "/" + st.node : "");
    if (location.hash !== h) history.replaceState(null, "", h);
  }
  App.persist = persist;
  function restore() {
    restoring = true;
    let st = {};
    try { st = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
    const hash = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (hash) { const [t, n] = hash.split("/"); if (t) st.tab = t; if (n) st.node = n; else if (hash.indexOf("/") < 0) st.node = null; }
    if (st.left) App.setLeft(true);
    if (st.right) App.setRight(true);
    if (st.bottom) App.setBottom(true);
    if (st.node && App.graph().hasNode(st.node)) App.graph().select(st.node);
    if (st.tab && App.tabs.some(t => t.id === st.tab)) App.switchTab(st.tab);
    restoring = false;
    persist();
  }

  /* ================= KEYBOARD NAV ================= */
  function initKeys() {
    document.addEventListener("keydown", e => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === "Escape") { App.graph().stopFlow(); App.graph().deselect(); $("#searchResults").classList.remove("open"); }
      else if (/^[1-7]$/.test(e.key)) { const t = App.tabs[+e.key - 1]; if (t) App.switchTab(t.id); }
    });
  }

  App.initFeatures = function () {
    initSearch(); initEntity(); initKeys();
    requestAnimationFrame(() => requestAnimationFrame(restore));
  };
})();

</script>
<script>
/* ============================================================
   App shell — explorer, tabs, content panes, right rail
   v3 — interactive everywhere
   ============================================================ */
(function () {
  const A = window.ARCH;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const escAttr = s => esc(s).replace(/"/g, "&quot;");
  let graph = null;

  /* ---- derived indexes ---- */
  const nodeById = {}; A.nodes.forEach(n => nodeById[n.id] = n);
  const riskByNode = {}; A.risks.forEach(r => (riskByNode[r.node] = riskByNode[r.node] || []).push(r));
  const hotspotByNode = {}; A.changeFrontier.forEach(c => { hotspotByNode[c.node] = Math.max(hotspotByNode[c.node] || 0, Math.max(...c.bars)); });
  // entity -> owner node (for universal hover linking).
  // The tracked-entity set is derived at runtime from A.nodes[].state and
  // A.stateOwnership[]. No hardcoded project-specific identifiers.
  const ENTITY = {};
  const TRACKED = [];
  function normNode(name) {
    if (!name) return null;
    const lc = String(name).toLowerCase();
    for (const n of A.nodes) {
      if (lc === n.id || lc === (n.label || "").toLowerCase()) return n.id;
    }
    for (const n of A.nodes) {
      if (lc.includes(n.id) || (n.label && lc.includes(n.label.toLowerCase()))) return n.id;
    }
    return null;
  }
  (A.stateOwnership || []).forEach(s => {
    const owner = normNode(s.owner);
    if (owner && s.items) {
      String(s.items).split(/[,;]\s*/).forEach(raw => {
        const key = raw.trim().split(" (")[0].split(".")[0];
        if (key && /^[A-Z][\w]*$/.test(key) && !ENTITY[key]) {
          ENTITY[key] = owner;
          TRACKED.push(key);
        }
      });
    }
  });
  (A.nodes || []).forEach(n => (n.state || []).forEach(st => {
    const key = String(st).split(" (")[0].split(".")[0];
    if (key && !ENTITY[key]) {
      ENTITY[key] = n.id;
      TRACKED.push(key);
    }
  }));
  window.App = window.App || {};
  window.App.ENTITY = ENTITY;
  function linkifyStates(str) {
    let out = esc(str);
    TRACKED.forEach(t => {
      const re = new RegExp("\\b" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "g");
      out = out.replace(re, `<span class="ent" data-entity="${t}">${t}</span>`);
    });
    return out;
  }
  function downstreamNodes(id) {
    const seen = new Set([id]); let fr = [id];
    while (fr.length) { const nx = []; fr.forEach(u => A.edges.forEach(e => { if (e.from === u && e.rel !== "peer" && !seen.has(e.to)) { seen.add(e.to); nx.push(e.to); } })); fr = nx; }
    seen.delete(id); return [...seen];
  }
  function daysSince(d) { return Math.round((Date.now() - new Date(d).getTime()) / 86400000); }

  /* path step label -> node id (for tracing on graph).
     Derived at runtime from A.dataFlow.steps[].sys mapping plus the optional
     A.dataFlow.pathMap override for projects that want custom routing. */
  const PATHMAP = (function () {
    const m = {};
    (A.dataFlow && A.dataFlow.steps || []).forEach(s => {
      const sys = String(s.sys || "").split("::")[0];
      if (sys && nodeById[sys]) m[sys] = sys;
    });
    Object.assign(m, (A.dataFlow && A.dataFlow.pathMap) || {});
    return m;
  })();
  function pathNodeSeq(steps) {
    const ids = (steps || []).map(s => PATHMAP[s] || (nodeById[s] ? s : null)).filter(Boolean);
    return ids.filter((id, i) => id !== ids[i - 1]); // collapse repeats
  }

  /* ---------------- tab registry ---------------- */
  const TABS = [
    { id: "graph", label: "Graph", ti: "◉", badge: A.nodes.length + " nodes" },
    { id: "flow", label: "Data Flow", ti: "↯", badge: ((A.dataFlow && A.dataFlow.steps) || []).length },
    { id: "deps", label: "Dependencies", ti: "⇄", badge: A.relationships.length },
    { id: "cov", label: "Coverage", ti: "▦" },
    { id: "paths", label: "Paths", ti: "⌥", badge: A.criticalPaths.length },
    { id: "concept", label: "Concept", ti: "✦" },
    { id: "source", label: "Source", ti: "#" },
  ];

  /* ---------------- top bar ---------------- */
  function renderTopbar() {
    const stale = daysSince(A.project.regenerated);
    const freshClass = stale > 30 ? "stale" : "fresh";
    $("#topbar").innerHTML = `
      <button class="tb-panel-toggle on" id="toggleLeft" title="Toggle explorer (⌘B)">☰</button>
      <div class="tb-brand"><div class="tb-logo"></div></div>
      <div class="tb-crumb">
        <span class="dim">context</span><span class="sep">/</span>
        <span class="proj">${esc(A.project.name)}</span><span class="sep">/</span>
        <span class="file">${esc(A.project.file ? A.project.file.split("/").pop() : "architecture.html")}</span>
      </div>
      <div class="tb-status"><span class="dot"></span>${esc(A.project.milestone)}</div>
      <div class="tb-spacer"></div>
      <button class="tb-panel-toggle on" id="toggleBottom" title="Toggle bottom strip">▭</button>
      <div class="tb-spacer"></div>
      <div class="tb-search-wrap">
        <div class="tb-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="search" placeholder="Search anything…" autocomplete="off" />
          <kbd>⌘K</kbd>
        </div>
        <div class="search-results" id="searchResults"></div>
      </div>
      <div class="tb-fresh ${freshClass}" data-tip="${escAttr("architecture.md regenerated " + stale + " days ago (" + A.project.regenerated + "). The upkeep-context skill keeps this in sync with HEAD.")}">
        <span class="fresh-dot"></span>${stale}d
      </div>
      <div class="tb-meta">HEAD <b>${esc(A.project.head)}</b></div>
      <div class="tb-viewmode" id="viewMode" data-tip="${escAttr("Switch between the rendered explorer and the raw architecture.md markdown that backs the current view")}">
        <button class="vm-btn active" data-vm="rendered">Rendered</button>
        <button class="vm-btn" data-vm="source">Source</button>
      </div>
      <button class="tb-panel-toggle on" id="toggleRight" title="Toggle context">▥</button>`;
  }

  /* ---------------- left explorer ---------------- */
  function renderExplorer() {
    const kinds = [["all", "All"], ["foundation", "Found."], ["env", "Env"], ["boundary", "Bound."], ["learner", "Learner"], ["observer", "Observer"]];
    const groups = [
      { name: "Overview", items: [
        { lbl: "Scope / Purpose", ico: "◷", tab: "source", anchor: "scope" },
        { lbl: "Repository Overview", ico: "▤", tab: "source", anchor: "overview" },
        { lbl: "Milestones", ico: "◈", tab: "source", anchor: "milestones" },
        { lbl: "Repository Tree", ico: "▸", tab: "source", anchor: "tree" },
      ]},
      { name: "Subsystems", count: A.nodes.length, items: A.nodes.map(n => ({
        lbl: n.label, node: n.id, kind: n.kind, meta: n.root.replace("src/", "").replace(/\/$/, "") || "main", isNode: true,
        risk: (riskByNode[n.id] || []).length, hot: (hotspotByNode[n.id] || 0) >= 60,
      })) },
      { name: "Execution", items: [
        { lbl: "Data Flow (" + (A.dataFlow && A.dataFlow.steps ? A.dataFlow.steps.length : 0) + " steps)", ico: "↯", tab: "flow", anchor: "flow" },
        { lbl: "Failure Semantics", ico: "⚠", tab: "flow", anchor: "failures" },
        { lbl: "Critical Paths", ico: "⌥", tab: "paths", anchor: "paths" },
      ].concat((A.bespoke || []).map(b => ({ lbl: b.title, ico: "✦", tab: "paths", anchor: "bespoke-" + b.id })))},
      { name: "Structure", items: [
        { lbl: "Dependency Layers", ico: "≡", tab: "deps", anchor: "layers" },
        { lbl: "Inter-System Relations", ico: "⇄", tab: "deps", anchor: "relations" },
        { lbl: "Adjacency Matrix", ico: "▦", tab: "deps", anchor: "matrix" },
        { lbl: "State Ownership", ico: "◫", tab: "deps", anchor: "state" },
        { lbl: "Coverage", ico: "▦", tab: "cov", anchor: "cov" },
        { lbl: "Concept Map", ico: "✦", tab: "concept", anchor: "concept" },
        { lbl: "Structural Notes", ico: "✎", tab: "concept", anchor: "notes" },
      ]},
    ];
    const html = `<div class="lr-filter" id="lrFilter">${kinds.map((k, i) => `<button class="lr-chip ${i === 0 ? "active" : ""}" data-kind="${k[0]}">${esc(k[1])}</button>`).join("")}</div>` +
      groups.map(g => `
      <div class="lr-group" data-group="${esc(g.name)}">
        <div class="lr-group-head">
          <span class="chev">▾</span>${esc(g.name)}
          ${g.count != null ? `<span class="gcount">${g.count}</span>` : ""}
        </div>
        <div class="lr-group-items">
          ${g.items.map(it => it.isNode ? `
            <div class="lr-item node-item" data-node="${it.node}" data-kind="${it.kind}" data-search="${esc(it.lbl)} ${esc(it.kind)}" data-tip="${escAttr(nodeById[it.node].tagline)}">
              <span class="swatch" style="background:var(--k-${it.kind})"></span>
              <span class="lbl">${esc(it.lbl)}</span>
              <span class="lr-flags">${it.hot ? '<span class="flag-hot" title="recent change hotspot">●</span>' : ""}${it.risk ? `<span class="flag-risk" title="${it.risk} risk(s)">▲</span>` : ""}</span>
              <span class="meta">${esc(it.meta)}</span>
            </div>` : `
            <div class="lr-item" data-tab="${it.tab}" data-anchor="${it.anchor || ""}" data-search="${esc(it.lbl)}">
              <span class="ico">${it.ico}</span><span class="lbl">${esc(it.lbl)}</span>
            </div>`).join("")}
        </div>
      </div>`).join("");
    $("#leftScroll").innerHTML = html;
    $$(".lr-group-items").forEach(el => el.style.maxHeight = el.scrollHeight + "px");

    $$(".lr-group-head").forEach(h => h.addEventListener("click", () => {
      const g = h.closest(".lr-group"); g.classList.toggle("collapsed");
    }));
    $$(".lr-item").forEach(it => it.addEventListener("click", () => {

    }));
    $$("#lrFilter .lr-chip").forEach(ch => ch.addEventListener("click", () => {

  function scrollToAnchor(id) {

    requestAnimationFrame(() => {
      view.scrollTo({ top: el.offsetTop - 20, behavior: "smooth" });
      el.classList.remove("pulse-anchor"); void el.offsetWidth; el.classList.add("pulse-anchor");
      setTimeout(() => el.classList.remove("pulse-anchor"), 1200);

    renderGraphTab(); renderFlowTab(); renderDepsTab(); renderCovTab();
    renderPathsTab(); renderConceptTab(); renderSourceTab();

  let curTab = "graph", mdMode = false;
  function switchTab(id, opt) {
    if (id !== "__md") curTab = id;
    if (!(opt && opt.keepMd)) mdMode = false;
    $$(".ws-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === curTab));
    const show = mdMode ? "__md" : curTab;
    $$(".ws-view").forEach(v => v.classList.toggle("active", v.dataset.view === show));
    $$("#viewMode .vm-btn").forEach(b => b.classList.toggle("active", (b.dataset.vm === "source") === mdMode));
    if (curTab === "graph" && !mdMode && graph) requestAnimationFrame(() => graph.fit());
    if (window.App.persist) window.App.persist();
  }
  function setMd(on) {
    if (mdMode === on) return;
    mdMode = on;
    if (mdMode) $("#mdPre").textContent = (window.App.markdownFor ? window.App.markdownFor(curTab) : "");
    switchTab(curTab, { keepMd: true });
  }

  /* ---------- GRAPH tab ---------- */
  function renderGraphTab() {
    $('[data-view="graph"]').innerHTML = `
      <div class="ws-toolbar">
        <div class="tool-group">
          <button class="tool-btn active" data-graph-mode="layered"><span class="ti">≡</span>Layered</button>
          <button class="tool-btn" data-graph-mode="force"><span class="ti">✦</span>Force</button>
          <button class="tool-btn" data-graph-mode="radial"><span class="ti">◎</span>Radial</button>
        </div>
        <div class="tool-group">
          <button class="tool-btn" data-impact-toggle id="gImpact" data-tip="${escAttr("Blast-radius mode: select a node to highlight everything that transitively depends on it.")}"><span class="ti">⊛</span>Impact</button>
          <button class="tool-btn" id="gPlay"><span class="ti">▶</span><span id="playLabel">Play tick</span></button>
        </div>
        <div class="tool-group">
          <button class="tool-btn" id="gFit"><span class="ti">⤢</span>Fit</button>
          <button class="tool-btn" id="gArrange" data-tip="${escAttr("Reset layout + cleared dragged positions")}"><span class="ti">↻</span>Reset</button>
        </div>
        <div class="tool-group">
          <button class="tool-btn" id="gZoomOut">−</button>
          <span class="zoom-val" id="zoomVal">100%</span>
          <button class="tool-btn" id="gZoomIn">+</button>
        </div>
        <div class="ws-hint" id="graphHint">drag to pan · scroll to zoom · click node to inspect</div>
      </div>
      <div class="graph-stage" id="graphStage"></div>

  function graphLegend() {
    const kinds = Object.entries(A.kindMeta);

      <div class="gl-head"><span class="gl-title">Legend</span><span class="gl-toggle">show ▴</span></div>
      <div class="gl-body">
        <div><div class="gl-col-title">Subsystem role</div>
          ${kinds.map(([k, m]) => `<div class="gl-row"><span class="sw" style="background:var(--k-${k})"></span>${esc(m.label)}</div>`).join("")}</div>
        <div><div class="gl-col-title">Edge type</div>

          <div class="gl-row"><span class="ln" style="border-top:2px solid var(--cyan)"></span>load-bearing</div>

  /* ---------- FLOW tab ---------- */
  function tagStyle(sys) {
    const n = nodeById[sys.split("::")[0]];
    const k = n ? n.kind : "observer";
    return `color:var(--k-${k});background:color-mix(in srgb, var(--k-${k}) 14%, transparent)`;
  }
  let flowView = "timeline";
  function curFlowSteps() { return (A.dataFlow && A.dataFlow.steps) || []; }
  function renderFlowTab() {
    const stepCount = curFlowSteps().length;
    $('[data-view="flow"]').innerHTML = `<div class="doc">
      <div class="doc-head" id="a-flow"><div class="doc-title">Core Execution / Data Flow</div>
      <div class="doc-sub">One traced operation · ${stepCount} step${stepCount === 1 ? "" : "s"} across the subsystem boundaries · click a step to flash it, hover a state to trace it</div></div>
      <div class="flow-controls">
        <div class="seg" id="flowView">
          <button class="seg-btn active" data-fv="timeline">Timeline</button>
          <button class="seg-btn" data-fv="swimlane">Swimlanes</button>
        </div>
        <button class="tool-btn solo" id="flowPlay" data-tip="${escAttr("Animate the traced operation across the topology graph")}"><span class="ti">▶</span>Play on graph</button>
      </div>
      <p class="doc-intro" id="flowIntro"></p>
      <div id="flowBody"></div>
      ${failuresHtml()}
    </div>`;
    paintFlowBody();
    $$("#flowView .seg-btn").forEach(b => b.addEventListener("click", () => { flowView = b.dataset.fv; $$("#flowView .seg-btn").forEach(x => x.classList.toggle("active", x === b)); paintFlowBody(); }));
    $("#flowPlay").addEventListener("click", () => playTick());
    wireFailures();
  }
  function paintFlowBody() {
    const f = A.dataFlow, steps = curFlowSteps();
    $("#flowIntro").innerHTML = esc((f && f.intro) || "");
    $("#flowBody").innerHTML = flowView === "swimlane" ? swimlaneHtml(steps) : timelineHtml(steps);
    $$('#flowBody .flow-step').forEach(st => st.addEventListener("click", () => flashStep(+st.dataset.step)));
  }
  function timelineHtml(steps) {
    return A.dataFlow.simsets.map(set => {
      const ss = steps.filter(s => s.set === set);
      if (!ss.length) return "";
      return `<div class="flow-set"><div class="flow-set-head"><span class="flow-set-name">${esc(set)}</span><span class="flow-set-line"></span></div>
        <div class="flow-steps">${ss.map(stepCard).join("")}</div></div>`;
    }).join("");
  }
  function stepCard(s) {
    return `<div class="flow-step ${s.fail ? "fail" : ""}" data-step="${s.n}" data-node="${s.sys.split("::")[0]}">
      <div class="fs-num">${String(s.n).padStart(2, "0")}</div>
      <div class="fs-main">
        <div class="fs-sys"><span class="fs-tag" style="${tagStyle(s.sys)}">${esc(s.sys)}</span><span class="fs-fn">${esc(s.fn)}</span></div>
        <div class="fs-io"><span class="io-k">reads</span><span class="io-v">${linkifyStates(s.reads)}</span>
          <span class="io-k">writes</span><span class="io-v write">${linkifyStates(s.writes)}</span></div>
      </div></div>`;
  }
  function swimlaneHtml(steps) {
    const cols = [];
    steps.forEach(s => { const c = s.sys.split("::")[0]; if (!cols.includes(c)) cols.push(c); });
    // Order by node-order in A.nodes (which respects the data-declared layer
    // sequence); anything not in A.nodes goes after, preserving first-seen
    // order from the steps. Project-agnostic.
    const nodeOrder = {};
    (A.nodes || []).forEach((n, i) => { nodeOrder[n.id] = i; });
    cols.sort((a, b) => (nodeOrder[a] != null ? nodeOrder[a] : 1e6) - (nodeOrder[b] != null ? nodeOrder[b] : 1e6));
    let h = `<div class="swim" style="grid-template-columns:34px repeat(${cols.length},minmax(120px,1fr))">`;
    h += `<div class="swim-corner"></div>` + cols.map(c => `<div class="swim-head" style="${tagStyle(c)}">${esc(c)}</div>`).join("");
    steps.forEach(s => {
      const owner = s.sys.split("::")[0];
      h += `<div class="swim-num ${s.fail ? "fail" : ""}">${String(s.n).padStart(2, "0")}</div>`;
      cols.forEach(c => {
        if (c === owner) h += `<div class="swim-cell flow-step ${s.fail ? "fail" : ""}" data-step="${s.n}" data-node="${owner}">
          <div class="swim-fn">${esc(s.fn)}</div><div class="swim-io">${linkifyStates(s.writes)}</div></div>`;
        else h += `<div class="swim-empty"></div>`;
      });
    });
    h += `</div>`;
    return h;
  }
  function failuresHtml() {
    return `<div class="card" id="a-failures" style="margin-top:14px">
      <div class="section-eyebrow">Failure semantics along the chain · ${A.failures.length} invariants · hover to highlight the bound steps</div>
      <div style="display:grid;gap:9px">
        ${A.failures.map((fl, i) => {
          const linked = String(fl.link).match(/\d+/g) || [fl.step];
          return `<div class="fail-inv" data-steps="${linked.join(",")}">
            <div class="fs-num" style="min-width:58px;color:var(--amber)">${esc(fl.link)}</div>
            <div class="fs-main"><div class="fs-fn" style="color:var(--tx);margin-bottom:3px">${esc(fl.title)}</div>
            <div style="font-size:11.5px;line-height:1.6;color:var(--tx-3)">${linkifyStates(fl.body)}</div></div></div>`;
        }).join("")}
      </div></div>`;
  }
  function wireFailures() {
    $$('#a-failures .fail-inv').forEach(fi => {
      const steps = fi.dataset.steps.split(",");
      fi.addEventListener("mouseenter", () => steps.forEach(n => $$(`#flowBody .flow-step[data-step="${n}"]`).forEach(s => s.classList.add("step-lit"))));
      fi.addEventListener("mouseleave", () => $$('#flowBody .flow-step.step-lit').forEach(s => s.classList.remove("step-lit")));
      fi.addEventListener("click", () => { flashStep(+steps[0]); });
    });
  }
  function flashStep(n) {
    $$(`#flowBody .flow-step[data-step="${n}"], #flowBody .swim-cell[data-step="${n}"]`).forEach(s => { s.classList.remove("flash"); void s.offsetWidth; s.classList.add("flash"); });
  }
  function playTick() {
    switchTab("graph");
    const steps = (A.dataFlow && A.dataFlow.steps) || [];
    const seq = steps.map(s => s.sys.split("::")[0]).filter((id, i, a) => id !== a[i - 1]);
    graph.flowNodes(seq, { interval: 560 });
  }

  /* ---------- DEPENDENCIES tab ---------- */
  function renderDepsTab() {
    const layers = `<div id="a-layers"><div class="section-eyebrow">Dependency direction · layered · downward-only</div>
      <div class="layer-stack">${A.layers.map((l, i) => `${i ? '<div class="layer-arrow">▼</div>' : ''}
        <div class="layer-box" data-layer="${esc(l.name)}"><div class="layer-name">${esc(l.name)}</div><div class="layer-role">${esc(l.role)}</div></div>`).join("")}</div>
      <p style="margin-top:14px;font-size:11.5px;line-height:1.6;color:var(--tx-3);max-width:680px">${linkifyStates(A.layersNote)}</p></div>`;

    const rel = `<div id="a-relations" style="margin-top:34px">
      <div class="section-eyebrow">Inter-system relationships · ${A.relationships.length} edges · click a row to trace it on the graph</div>
      <div class="rel-tools"><div class="tb-search mini"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="relSearch" placeholder="filter relationships…"/></div></div>
      <div class="card" style="padding:6px 14px;overflow-x:auto">
        <table class="rel-table" id="relTable"><thead><tr><th>A</th><th>B</th><th>Mechanism</th><th>Data</th><th>Breaks if violated</th></tr></thead>
        <tbody>${A.relationships.map(r => `<tr data-a="${esc(normNode(r.a) || "")}" data-b="${esc(normNode(r.b) || "")}" data-hay="${escAttr((r.a + " " + r.b + " " + r.mech + " " + r.data + " " + r.breaks).toLowerCase())}">
          <td class="side">${esc(r.a)}</td><td class="side">${esc(r.b)}</td>
          <td>${linkifyStates(r.mech)}</td><td>${esc(r.data)}</td><td class="breaks">${esc(r.breaks)}</td></tr>`).join("")}</tbody></table>
      </div></div>`;

    const state = `<div id="a-state" style="margin-top:34px"><div class="section-eyebrow">State ownership · who owns what; who else reads it</div>
      <div class="grid-2">${A.stateOwnership.map(s => `<div class="kv-card"><div class="owner" data-node="${esc(normNode(s.owner) || "")}">${esc(s.owner)}</div><div class="items">${linkifyStates(s.items)}</div></div>`).join("")}</div></div>`;

    $('[data-view="deps"]').innerHTML = `<div class="doc">
      <div class="doc-head"><div class="doc-title">Dependencies & Structure</div>
      <div class="doc-sub">Layered direction, the full edge ledger, the adjacency matrix and state-ownership boundaries</div></div>
      ${layers}<div id="a-matrix" style="margin-top:34px">${matrixHtml()}</div>${rel}${state}</div>`;

    wireMatrix(); wireRelTable();
    $$('#a-state .owner[data-node]').forEach(o => { if (o.dataset.node) o.addEventListener("click", () => { switchTab("graph"); graph.select(o.dataset.node); }); });
    $$('#a-layers .layer-box').forEach(b => b.addEventListener("click", () => {
      const ids = b.dataset.layer.split("·").map(s => s.trim());
      switchTab("graph"); if (graph.hasNode(ids[0])) graph.select(ids[0]);
    }));
  }
  function matrixHtml() {
    const ids = A.nodes.map(n => n.id);
    const adj = {}; ids.forEach(a => adj[a] = {});
    A.edges.forEach(e => { adj[e.from][e.to] = e.rel; });
    return `<div class="section-eyebrow">Adjacency matrix · row → column means “row feeds / is depended-on-by column”</div>
      <div class="card matrix-scroll" style="padding:14px"><table class="matrix" id="adjMatrix"><thead><tr><th></th>
      ${ids.map((c, i) => `<th data-col="${i}">${esc(c)}</th>`).join("")}</tr></thead><tbody>
      ${ids.map((r, ri) => `<tr data-row="${ri}"><th class="rowh">${esc(r)}</th>${ids.map((c, ci) => {
        if (r === c) return `<td class="diag" data-row="${ri}" data-col="${ci}">·</td>`;
        const rel = adj[r][c];
        if (!rel) return `<td data-row="${ri}" data-col="${ci}"></td>`;
        const cls = rel === "strong" ? "strong" : (rel === "write" ? "wr" : rel === "peer" ? "pe" : "on");
        const ch = rel === "peer" ? "↔" : "→";
        return `<td class="${cls}" data-row="${ri}" data-col="${ci}" data-from="${r}" data-to="${c}" data-tip="${escAttr(r + " → " + c + ": " + (A.edges.find(e => e.from === r && e.to === c) || {}).label)}">${ch}</td>`;
      }).join("")}</tr>`).join("")}
      </tbody></table></div>`;
  }
  function wireMatrix() {
    const tbl = $("#adjMatrix"); if (!tbl) return;
    tbl.querySelectorAll("td[data-from]").forEach(td => {
      td.addEventListener("mouseenter", () => {
        tbl.querySelectorAll(`[data-row="${td.dataset.row}"]`).forEach(x => x.classList.add("mx-hl"));
        tbl.querySelectorAll(`[data-col="${td.dataset.col}"]`).forEach(x => x.classList.add("mx-hl"));
      });
      td.addEventListener("mouseleave", () => tbl.querySelectorAll(".mx-hl").forEach(x => x.classList.remove("mx-hl")));
      td.addEventListener("click", () => { switchTab("graph"); graph.selectEdge(td.dataset.from, td.dataset.to); });
    });
  }
  function wireRelTable() {
    const inp = $("#relSearch");
    if (inp) inp.addEventListener("input", () => {
      const q = inp.value.trim().toLowerCase();
      $$('#relTable tbody tr').forEach(tr => tr.style.display = (!q || tr.dataset.hay.includes(q)) ? "" : "none");
    });
    $$('#relTable tbody tr').forEach(tr => tr.addEventListener("click", () => {
      const a = tr.dataset.a, b = tr.dataset.b;
      if (a && b && graph.hasNode(a) && graph.hasNode(b)) { switchTab("graph"); graph.selectEdge(a, b); }
      else if (a) { switchTab("graph"); graph.select(a); }
    }));
  }

  /* ---------- COVERAGE tab ----------
     LENS provides a one-line description per coverage column. Projects override
     this via A.coverage.lenses = { <col-id>: "description", ... } when they
     want richer column hover text. Without that, the column id itself is used
     as the lens label - project-agnostic by default. */
  const LENS = (A.coverage && A.coverage.lenses) || {};
  const LVL = { 3: "Full inspection this pass", 2: "Partial inspection", 1: "Trusted from a prior pass" };
  const LVLSHORT = { 3: "full", 2: "partial", 1: "trusted" };
  function renderCovTab() {
    const c = A.coverage;
    let depthSum = 0, depthN = 0;
    const lensCount = {}; c.cols.forEach(l => lensCount[l] = 0);
    const rows = c.rows.map(row => {
      const lenses = c.cols.filter(co => row.cells[co]).sort((a, b) => row.cells[b] - row.cells[a]);
      const max = lenses.length ? Math.max(...lenses.map(l => row.cells[l])) : 0;
      if (max) { depthSum += max; depthN++; }
      lenses.forEach(l => lensCount[l]++);
      const chips = lenses.length ? lenses.map(l => {
        const v = row.cells[l], pv = (row.prev && row.prev[l]) || 0;
        const delta = v - pv;
        const arr = pv === 0 && v > 0 ? '<span class="cov-delta new">NEW</span>' : (delta > 0 ? `<span class="cov-delta up">▲${delta}</span>` : "");
        return `<span class="cov-chip lv${v}" data-tip="${escAttr(LENS[l] + " — " + LVL[v] + " (" + v + ")" + (pv ? " · prior pass: " + pv : " · not inspected last pass"))}">${esc(l)}<span class="lvl">${LVLSHORT[v]}</span>${arr}</span>`;
      }).join("") : `<span class="cov-empty">no inspection logged — trusted from structure</span>`;
      return `<div class="cov-row2 ${max ? "" : "uncovered"}" data-node="${esc(row.node || "")}">
        <div class="cov-mod">${esc(row.label)}</div>
        <div class="cov-depth"><div class="cov-depth-track"><div class="cov-depth-fill" style="width:${(max / 3) * 100}%"></div></div><span class="cov-depth-label">${max ? LVLSHORT[max] : "—"}</span></div>
        <div class="cov-chips">${chips}</div>
      </div>`;
    }).join("");
    const score = depthN ? (depthSum / depthN) : 0;
    const summary = `<div class="cov-summary">
      <div class="cov-score"><div class="cov-score-val">${score.toFixed(1)}<span>/3</span></div><div class="cov-score-lbl">mean depth across ${depthN} inspected modules</div></div>
      <div class="cov-lenscol">${c.cols.map(l => `<div class="cov-lenscell" data-tip="${escAttr(LENS[l])}"><span class="cov-lenscount">${lensCount[l]}</span><span class="cov-lensname">${esc(l)}</span></div>`).join("")}</div>
    </div>`;

    $('[data-view="cov"]').innerHTML = `<div class="doc">
      <div class="doc-head"><div class="doc-title">Coverage</div>
      <div class="doc-sub">Which inspection lenses examined each source module, how deeply, and what changed since the prior pass · ${esc(A.project.regenerated)}</div></div>
      <p class="cov-intro">Each pass walks the code through a set of <strong>lenses</strong>. A module's <strong>depth</strong> is the deepest lens applied to it this pass; <span style="color:var(--cyan)">▲ / NEW</span> marks modules freshly re-read since last time. Click a module to open its node.</p>
      ${summary}
      <div class="cov-scale"><span class="cov-scale-label">Depth</span><div class="cov-scale-group">
        <span class="cov-scale-item"><span class="cov-swatch lv3"></span>Full (3)</span>
        <span class="cov-scale-item"><span class="cov-swatch lv2"></span>Partial (2)</span>
        <span class="cov-scale-item"><span class="cov-swatch lv1"></span>Trusted (1)</span></div></div>
      <div class="cov-lens-key">${c.cols.map(co => `<span class="cov-lens-pill" data-tip="${escAttr(LENS[co])}"><b>${esc(co)}</b></span>`).join("")}</div>
      <div class="cov-rows" id="a-cov">${rows}</div>
      <p style="margin-top:18px;font-size:11.5px;line-height:1.6;color:var(--tx-3);max-width:740px">${esc(c.note)}</p></div>`;
    $$('#a-cov .cov-row2[data-node]').forEach(r => { if (r.dataset.node) r.addEventListener("click", () => { switchTab("graph"); graph.select(r.dataset.node); }); });
  }

  /* ---------- PATHS tab ---------- */
  function renderPathsTab() {
    const paths = `<div id="a-paths"><div class="section-eyebrow">Critical paths and blast radius · ${A.criticalPaths.length} chains · ▶ traces the chain across the graph</div>
      ${A.criticalPaths.map((p, i) => `<div class="path-card">
        <div class="path-head"><span class="path-name">${esc(p.name)}</span>
          <span style="display:flex;align-items:center;gap:10px"><span class="path-len">${esc(p.len)}</span>
          <button class="tool-btn solo path-play" data-path="${i}"><span class="ti">▶</span>Trace</button></span></div>
        <div class="path-flow">${p.steps.map((s, j) => `${j ? '<span class="path-arrow">→</span>' : ''}<span class="path-step">${esc(s)}</span>`).join("")}</div>
        <p class="path-blast">${linkifyStates(p.blast)}</p></div>`).join("")}</div>`;

    // Generic bespoke[] renderer. Each item in A.bespoke is a project-specific
    // deep-dive widget with shape: {id, title, subtitle, steps[], panels[], ctx?}.
    // Project-agnostic: the rendering reads from data only; no hardcoded
    // pipeline names, no hardcoded category-to-panel maps. Projects that need
    // a category-to-panel spotlight declare it via bespoke[].catPanel.
    const bespokeBlocks = (A.bespoke || []).map(b => `
      <div id="a-bespoke-${esc(b.id)}" style="margin-top:36px">${bespokeExplorer(b)}</div>
    `).join("");
    $('[data-view="paths"]').innerHTML = `<div class="doc">
      <div class="doc-head"><div class="doc-title">Critical Paths</div>

  function wireBespokeExplorer(b) {
    const wrap = document.querySelector(`.tick-wrap[data-tick="${b.id}"]`);
    if (!wrap) return;
    const side = wrap.querySelector(".tick-side");
    const catPanel = b.catPanel || {};
    function clearDetail() {
      wrap.querySelectorAll(".tick-step").forEach(s => s.classList.remove("active"));
      wrap.querySelectorAll(".tick-panel").forEach(p => p.classList.remove("panel-lit"));
      const d = side.querySelector(".tick-detail"); if (d) d.remove();
    }
    wrap.querySelectorAll(".tick-step").forEach(st => st.addEventListener("click", () => {
      const wasActive = st.classList.contains("active");
      clearDetail();
      if (wasActive) return;
      st.classList.add("active");
      const step = (b.steps || []).find(s => s.id === st.dataset.id) || {};
      const pt = catPanel[st.dataset.cat];
      if (pt) { const panel = [...wrap.querySelectorAll(".tick-panel")].find(p => p.dataset.panel === pt); if (panel) panel.classList.add("panel-lit"); }
      const d = document.createElement("div"); d.className = "tick-detail"; side.insertBefore(d, side.firstChild);
      d.innerHTML = `<div class="tdh">Step ${esc(st.dataset.id)}${st.dataset.sys ? ` · <span class="sys">${esc(st.dataset.sys)}</span>` : ""}</div>
        <div class="td-body">${esc(step.body || "")}</div>
        ${(b.ctx && b.ctx[st.dataset.cat]) ? `<div class="td-ctx">${esc(b.ctx[st.dataset.cat])}${pt ? ` <span class="td-see">-> see ${esc(pt)}</span>` : ""}</div>` : ""}`;
    }));
  }

  /* ---------- CONCEPT tab (interactive mini-graph) ---------- */
  function renderConceptTab() {
    const c = A.concept;
    $('[data-view="concept"]').innerHTML = `<div class="doc">
      <div class="doc-head"><div class="doc-title">Concept & Reality</div>
      <div class="doc-sub">The domain knowledge map (distinct from the dependency graph) and what is actually true at HEAD ${esc(A.project.head)}</div></div>
      <div id="a-concept"><div class="section-eyebrow">Concept map · click a branch to open its subsystem · hover a leaf for its glossary definition</div>
        <div class="concept-stage"><svg id="conceptSvg"></svg></div></div>
      <div id="a-notes" style="margin-top:30px"><div class="section-eyebrow">Structural notes / current reality · ${A.notes.length} notes</div>
        <div class="grid-2">${A.notes.map(n => `<div class="note-card ${n.sev}">
          <div class="note-head"><span class="note-tag ${n.sev}">${esc(n.tag)}</span><span class="note-title">${esc(n.title)}</span></div>
          <div class="note-body">${linkifyStates(n.body)}</div></div>`).join("")}</div></div></div>`;
    renderConceptGraph();
  }
  const GLOSS = {}; A.glossary.forEach(g => GLOSS[g.term.toLowerCase()] = g.def);
  function leafDef(text) {
    for (const k in GLOSS) if (text.toLowerCase().includes(k)) return GLOSS[k];
    return text;
  }
  function renderConceptGraph() {
    const svg = $("#conceptSvg"), W = 860, H = 380;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    const cx = W / 2, cy = 64;
    // branch.kind is the optional A.kindMeta key (foundation/learner/etc.)
    // that ties the concept branch to a subsystem role - its colour comes from
    // the kindMeta swatch CSS variable. branch.node is the explicit node id
    // the branch should highlight on click (optional). Project-agnostic
    // defaults: spread branches evenly across the canvas; colour by kind.
    const palette = ["var(--cyan)", "var(--violet)", "var(--amber)", "var(--teal)", "var(--sage)"];
    const branches = A.concept.branches.map((b, bi, arr) => ({
      b,
      x: W * ((bi + 1) / (arr.length + 1)),
      y: 180,
      node: b.node || null,
      col: b.kind ? `var(--k-${b.kind})` : palette[bi % palette.length],
    }));
    let s = "";
    // links root→branch
    branches.forEach(br => { s += `<path d="M ${cx} ${cy + 16} C ${cx} ${cy + 70}, ${br.x} ${br.y - 70}, ${br.x} ${br.y - 18}" fill="none" stroke="${br.col}" stroke-width="1.5" opacity="0.5"/>`; });
    // leaves
    branches.forEach(br => {
      const leaves = br.b.leaves.concat(br.b.trunks);
      leaves.forEach((lf, i) => {
        const n = leaves.length, spread = 150, lx = br.x - spread + (i / Math.max(1, n - 1)) * spread * 2, ly = br.y + 78 + (i % 2) * 40;
        s += `<line x1="${br.x}" y1="${br.y + 18}" x2="${lx}" y2="${ly - 12}" stroke="${br.col}" stroke-width="1" opacity="0.3"/>`;
        s += `<g class="cg-leaf" data-tip="${escAttr(leafDef(lf))}"><rect x="${lx - 70}" y="${ly - 12}" width="140" height="24" rx="6" fill="#11131b" stroke="${br.col}" stroke-opacity="0.35"/>
          <text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="central" font-size="8.5" fill="#a6adbf" font-family="var(--mono)">${esc(lf.length > 26 ? lf.slice(0, 25) + "…" : lf)}</text></g>`;
      });
    });
    // branch nodes
    branches.forEach(br => {
      s += `<g class="cg-branch" data-node="${br.node}" style="cursor:pointer"><rect x="${br.x - 92}" y="${br.y - 18}" width="184" height="36" rx="9" fill="#11131b" stroke="${br.col}" stroke-width="1.6"/>
        <text x="${br.x}" y="${br.y}" text-anchor="middle" dominant-baseline="central" font-size="12" fill="${br.col}" font-family="var(--mono)" font-weight="600">${esc(br.b.head)}</text></g>`;
    });
    // root
    s += `<g><rect x="${cx - 70}" y="${cy - 16}" width="140" height="32" rx="16" fill="var(--violet-dim)" stroke="var(--violet)" stroke-width="1.4"/>
      <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#e7eaf2" font-family="var(--mono)" font-weight="600">${esc(A.concept.root)}</text></g>`;
    svg.innerHTML = s;
    svg.querySelectorAll(".cg-branch").forEach(g => g.addEventListener("click", () => { switchTab("graph"); graph.select(g.dataset.node); }));
  }

  // TREENODE maps repoTree folder names to subsystem node ids when the folder
  // name does not match a node id directly. Projects may declare these via
  // node.{node: "<id>"} entries on each repoTree.children entry, which is the
  // preferred (data-driven) approach. This map is the fallback for projects
  // that did not annotate.
  const TREENODE = (A.repoTree && A.repoTree.folderToNode) || {};
  function renderTree() {
    const host = $("#repoTree");
    function nodeHtml(n) {
      const isDir = !n.file, kids = n.children || [], open = n.open;
      const sysId = n.node || TREENODE[n.name];
      const swatch = sysId ? `<span class="tree-ico dir" style="color:var(--k-${(nodeById[sysId] || {}).kind || "observer"})">▣</span>` :
        `<span class="tree-ico ${isDir ? "dir" : "file"}">${isDir ? "▣" : "·"}</span>`;
      const tog = (isDir && kids.length) ? `<span class="tree-tog">${open ? "▾" : "▸"}</span>` : `<span class="tree-tog">·</span>`;
      let h = `<div class="tree-node" ${sysId ? `data-sys="${sysId}"` : ""}>${tog}${swatch}<span class="tree-name ${n.file ? "file" : ""}">${esc(n.name)}</span>${n.anno ? `<span class="tree-anno">${esc(n.anno)}</span>` : ""}</div>`;
      if (kids.length) h += `<div class="tree-kids" ${open ? "" : 'style="display:none"'}>${kids.map(nodeHtml).join("")}</div>`;
      return h;
    }
    host.innerHTML = nodeHtml(A.repoTree);
    host.querySelectorAll(".tree-node").forEach(tn => tn.addEventListener("click", e => {
      e.stopPropagation();
      const kids = tn.nextElementSibling;
      if (kids && kids.classList.contains("tree-kids")) {
        const hidden = kids.style.display === "none"; kids.style.display = hidden ? "" : "none";
        const tog = tn.querySelector(".tree-tog"); if (tog && tog.textContent !== "·") tog.textContent = hidden ? "▾" : "▸";

  }
